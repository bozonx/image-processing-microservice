services:
  image-processing:
    image: ghcr.io/bozonx/image-processing-microservice:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: image-processing-microservice
    hostname: image-processing-microservice
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '${LISTEN_PORT:-8080}:${LISTEN_PORT:-8080}'
    env_file:
      - path: ../.env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1G
    # Stateless service: image data is streamed and no persistent volume is needed.
