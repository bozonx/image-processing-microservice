services:
  image-processing:
    image: ghcr.io/bozonx/image-processing-microservice:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: image-processing-microservice
    hostname: image-processing-microservice
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      # required: false — in an orchestrator the environment comes from the platform and
      # there is no file to read.
      - path: ../.env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1G
    # Mirrors the HEALTHCHECK in the image, so `docker compose ps` and the orchestrator agree
    # on what healthy means. Dependency-free, so it survives a change of base image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8080/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Stateless service: image data is streamed and no persistent volume is needed.
